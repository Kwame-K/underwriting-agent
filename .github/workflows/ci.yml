name: Continuous Integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-tests:
    name: Quality checks and tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Stub URLs so pydantic-settings loads without real services running
      KNOWLEDGE_AGENT_BASE_URL: "http://localhost:8001"
      SUBMISSION_EXTRACTOR_BASE_URL: "http://localhost:8000"
      DATABASE_URL: "sqlite:///./data/underwriting_agent_ci.db"

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true

      - name: Install Python 3.11
        run: uv python install 3.11

      - name: Install locked dependencies
        run: uv sync --locked --all-groups

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Lint
        run: uv run ruff check .

      - name: Type check
        run: uv run mypy src

      - name: Create data directory for SQLite
        run: mkdir -p data

      - name: Run tests with coverage
        run: uv run pytest --cov=src/underwriting_agent --cov-report=term-missing --cov-report=xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage.xml
          retention-days: 14

  docker-build:
    name: Docker image build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: quality-and-tests

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Build Docker image
        run: docker build --tag underwriting-agent:ci .
